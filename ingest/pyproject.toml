[project]
name = "drone-ingest"
version = "0.1.0"
description = "PX4 Flight Review ingestion: index snapshot + ULog files -> landing (RustFS) -> bronze (Iceberg)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
    "pyulog==1.2.4",
    "boto3>=1.40,<2",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "ijson>=3.3,<4",
]

[project.scripts]
drone-ingest = "drone_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
