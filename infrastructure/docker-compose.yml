# PX4 flight-log lakehouse. Services are added phase by phase (CLAUDE.md section 7);
# compare with `git diff phase-N phase-M -- infrastructure/docker-compose.yml`.
# Relative paths below resolve from this folder (infrastructure/); variables come from the root .env.
name: px4-lakehouse

# Shared by the four Airflow services (Phase 5)
x-airflow-common: &airflow-common
  build:
    context: ..  # repo root, filtered by /.dockerignore
    dockerfile: infrastructure/airflow/Dockerfile
    args:
      AIRFLOW_TAG: ${AIRFLOW_TAG:?set AIRFLOW_TAG in .env}
  image: px4-lakehouse/airflow:${AIRFLOW_TAG}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"  # nothing downloads until you unpause a DAG
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # No login (local toy, ports bound to 127.0.0.1): everyone is admin. Same no-auth non-goal as Trino.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__API__WORKERS: "1"  # 8 GB laptop budget
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_TRINO_DEFAULT: '{"conn_type": "trino", "host": "trino", "port": 8080, "login": "airflow", "extra": {"catalog": "iceberg"}}'
    # drone_ingest (runs from /opt/ingest-venv through its CLI; internal service names)
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    CATALOG_URI: http://lakekeeper:8181/catalog
    WORK_DIR: /opt/airflow/work
    DISK_GUARD_PATH: /opt/airflow/work  # on the Docker VM disk, like the RustFS volume
    INDEX_START_DATE: ${PX4_INDEX_START_DATE:-2025-01-01}
    MAX_ULOGS_PER_RUN: ${PX4_MAX_ULOGS_PER_RUN:-}  # empty = every log of the day (D-004)
    # dbt (Phase 6): project mounted at /opt/dbt, run from /opt/dbt-venv
    DBT_PROFILES_DIR: /opt/dbt
    DBT_PROJECT_DIR: /opt/dbt
    TRINO_HOST: trino
    TRINO_PORT: "8080"
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ../dbt:/opt/dbt  # read-write: dbt writes target/, logs/, dbt_packages/ here
    - ./scripts:/opt/scripts:ro  # check_charts.py (Phase 8)
    - airflow-logs:/opt/airflow/logs
    - airflow-work:/opt/airflow/work
  user: "50000:0"
  restart: unless-stopped
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  # One Postgres, one database + role per consumer: airflow (Phase 5), lakekeeper (Phase 3).
  postgres:
    image: postgres:${POSTGRES_TAG:?set POSTGRES_TAG in .env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read only by postgres/init/01-create-databases.sh on the first start
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP only comes up after the init scripts finish, and the query proves the lakekeeper db exists
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d lakekeeper -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # S3-compatible object storage: landing (raw API files), lakehouse (Iceberg), reports (rendered boards)
  rustfs:
    image: rustfs/rustfs:${RUSTFS_TAG:?set RUSTFS_TAG in .env}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      default:
        # One S3 address that works everywhere: containers resolve this alias to RustFS, and
        # browsers resolve any *.localhost to 127.0.0.1 (the published port below). Lakekeeper
        # hands this endpoint to clients, including DuckDB-WASM in its web UI.
        aliases: [rustfs.localhost]
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Runs once: creates the buckets (idempotent), then exits 0
  rustfs-init:
    image: amazon/aws-cli:${AWSCLI_TAG:?set AWSCLI_TAG in .env}
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_CONFIG_FILE: /scripts/aws-config  # forces path-style addressing
      BUCKETS: landing lakehouse reports
      # Browser origins allowed to read s3://lakehouse (Lakekeeper UI's DuckDB-WASM query engine)
      CORS_BUCKET: lakehouse
      CORS_ORIGINS: http://localhost:8181 http://127.0.0.1:8181
    volumes:
      - ./rustfs:/scripts:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # --- Phase 3: Iceberg catalog (Lakekeeper) + SQL engine (Trino) ---------------

  # Runs once: creates/upgrades Lakekeeper's tables in the lakekeeper database
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_TAG:?set LAKEKEEPER_TAG in .env}
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set LAKEKEEPER_ENCRYPTION_KEY in .env}
      # info everywhere, except the startup "Authentication is disabled" warning: running without
      # auth is a deliberate non-goal (ports are bound to 127.0.0.1). Drop the override if auth is added.
      RUST_LOG: info,lakekeeper::service::authn=error
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Iceberg REST catalog: /catalog (Iceberg REST spec), /management (warehouses), /ui (web UI)
  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_TAG}
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Runs once: accepts the terms (bootstrap) and creates warehouse "px4" on s3://lakehouse/
  lakekeeper-bootstrap:
    image: curlimages/curl:${CURL_TAG:?set CURL_TAG in .env}
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      WAREHOUSE: px4
      S3_BUCKET: lakehouse
      # Stored in the warehouse and handed to clients: must resolve in containers AND the browser
      S3_ENDPOINT: http://rustfs.localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./lakekeeper:/scripts:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: "no"

  # Single-node SQL engine; stores nothing itself. UI on http://localhost:8085
  trino:
    image: trinodb/trino:${TRINO_TAG:?set TRINO_TAG in .env}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}  # read by ${ENV:...} in catalog/iceberg.properties
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:8085:8080"
    mem_limit: 3g  # 2 GB heap (jvm.config) + off-heap headroom
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # Runs once: creates the bronze/silver/gold/audit schemas through Trino (idempotent)
  trino-init:
    image: trinodb/trino:${TRINO_TAG}
    entrypoint: ["trino", "--server", "http://trino:8080", "--user", "init", "--file", "/scripts/init-schemas.sql"]
    volumes:
      - ./trino/init:/scripts:ro
    healthcheck:
      disable: true  # the image's built-in check is for the server, not this CLI job
    depends_on:
      trino:
        condition: service_healthy
    restart: "no"

  # --- Phase 5: orchestration (Airflow 3, LocalExecutor) ---------------------------

  # Runs once: Airflow's tables, the CDN pool, dbt packages (Cosmos parses with them) and dbt's manifest
  # (dbt Charts resolves ref() through target/manifest.json)
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate && airflow pools set px4_pool 4 "PX4 CDN download/parse concurrency"
        && (cd /opt/dbt && /opt/dbt-venv/bin/dbt deps --quiet && /opt/dbt-venv/bin/dbt parse --quiet)
        && airflow version
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # UI + REST API + the execution API that task processes report to. http://localhost:8080
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Decides what runs when; with LocalExecutor it also runs the tasks (as subprocesses)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      # tasks need the bronze/audit namespaces (and so the whole catalog chain)
      trino-init:
        condition: service_completed_successfully

  # Parses dags/*.py into serialized DAGs (separate from the scheduler since Airflow 3)
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s

  # --- Phase 8: dashboards (dbt Charts) -------------------------------------------------

  # Live boards on http://localhost:8088/<board>/ (e.g. /fleet_overview/). Same image as Airflow:
  # dct lives in /opt/charts-venv, so no extra image on disk. Queries Trino as user "charts".
  charts:
    image: px4-lakehouse/airflow:${AIRFLOW_TAG}
    entrypoint: ["/opt/charts-venv/bin/dct"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8088", "--project-dir", "/opt/dbt"]
    user: "50000:0"
    environment:
      DBT_PROFILES_DIR: /opt/dbt
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: charts
    volumes:
      - ../dbt:/opt/dbt
      - ./scripts:/opt/scripts:ro
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8088/fleet_overview/"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    depends_on:
      trino:
        condition: service_healthy
      airflow-init:  # dbt parse -> target/manifest.json
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
  airflow-logs:
  airflow-work:
