# PX4 flight-log lakehouse: 8 containers (6 services + 2 one-shot jobs; Phase 10 simplification).
#   postgres -> lakekeeper-migrate -> lakekeeper -> setup (+ rustfs) -> trino -> airflow, charts
# Relative paths below resolve from this folder (infrastructure/); variables come from the root .env.
name: px4-lakehouse

# Shared by the containers that run the Airflow image (setup, airflow)
x-airflow-common: &airflow-common
  build:
    context: ..  # repo root, filtered by /.dockerignore
    dockerfile: infrastructure/airflow/Dockerfile
    args:
      AIRFLOW_TAG: ${AIRFLOW_TAG:?set AIRFLOW_TAG in .env}
  image: px4-lakehouse/airflow:${AIRFLOW_TAG}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"  # nothing downloads until you unpause a DAG
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/  # standalone: same container
    # No login (local toy, ports bound to 127.0.0.1): everyone is admin. Same no-auth non-goal as Trino.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__API__WORKERS: "1"  # 8 GB laptop budget
    AIRFLOW_CONN_TRINO_DEFAULT: '{"conn_type": "trino", "host": "trino", "port": 8080, "login": "airflow", "extra": {"catalog": "iceberg"}}'
    # drone_ingest (runs from /opt/ingest-venv through its CLI; internal service names)
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    CATALOG_URI: http://lakekeeper:8181/catalog
    LAKEKEEPER_URL: http://lakekeeper:8181  # setup.py
    WORK_DIR: /opt/airflow/work
    DISK_GUARD_PATH: /opt/airflow/work  # on the Docker VM disk, like the RustFS volume
    INDEX_START_DATE: ${PX4_INDEX_START_DATE:-2025-01-01}
    MAX_ULOGS_PER_RUN: ${PX4_MAX_ULOGS_PER_RUN:-}  # empty = every log of the day (D-004)
    # dbt (Phase 6): project mounted at /opt/dbt, run from /opt/dbt-venv
    DBT_PROFILES_DIR: /opt/dbt
    DBT_PROJECT_DIR: /opt/dbt
    TRINO_HOST: trino
    TRINO_PORT: "8080"
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ../dbt:/opt/dbt  # read-write: dbt writes target/, logs/, dbt_packages/ here
    - ./scripts:/opt/scripts:ro  # check_charts.py (Phase 8)
    - airflow-logs:/opt/airflow/logs
    - airflow-work:/opt/airflow/work
  user: "50000:0"

services:
  # One Postgres, one database + role per consumer: airflow, lakekeeper.
  postgres:
    image: postgres:${POSTGRES_TAG:?set POSTGRES_TAG in .env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read only by postgres/init/01-create-databases.sh on the first start
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # TCP only comes up after the init scripts finish, and the query proves the lakekeeper db exists
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d lakekeeper -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # S3-compatible object storage: landing (raw API files), lakehouse (Iceberg), reports (rendered boards)
  rustfs:
    image: rustfs/rustfs:${RUSTFS_TAG:?set RUSTFS_TAG in .env}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      default:
        # One S3 address that works everywhere: containers resolve this alias to RustFS, and
        # browsers resolve any *.localhost to 127.0.0.1 (the published port below). Lakekeeper
        # hands this endpoint to clients, including DuckDB-WASM in its web UI.
        aliases: [rustfs.localhost]
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --- Iceberg catalog (Lakekeeper) + SQL engine (Trino) --------------------------------

  # Runs once: creates/upgrades Lakekeeper's tables in the lakekeeper database
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_TAG:?set LAKEKEEPER_TAG in .env}
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set LAKEKEEPER_ENCRYPTION_KEY in .env}
      # info everywhere, except the startup "Authentication is disabled" warning: running without
      # auth is a deliberate non-goal (ports are bound to 127.0.0.1). Drop the override if auth is added.
      RUST_LOG: info,lakekeeper::service::authn=error
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Iceberg REST catalog: /catalog (Iceberg REST spec), /management (warehouses), /ui (web UI)
  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_TAG}
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Single-node SQL engine; stores nothing itself. UI on http://localhost:8085
  trino:
    image: trinodb/trino:${TRINO_TAG:?set TRINO_TAG in .env}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}  # read by ${ENV:...} in catalog/iceberg.properties
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:8085:8080"
    mem_limit: 3g  # 2 GB heap (jvm.config) + off-heap headroom
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      setup:  # the Iceberg catalog (warehouse px4) must exist before Trino uses it
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Setup + orchestration (Airflow image) ------------------------------------------------

  # Runs once, idempotent: everything a person would configure by hand (infrastructure/setup/setup.py):
  # buckets + lifecycle rules + CORS, Lakekeeper bootstrap/warehouse/soft delete, namespaces + protection;
  # then dbt deps/parse (Cosmos parses the project with the packages; dbt Charts resolves ref() via the manifest).
  setup:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        /opt/ingest-venv/bin/python /opt/setup/setup.py
        && cd /opt/dbt && /opt/dbt-venv/bin/dbt deps --quiet && /opt/dbt-venv/bin/dbt parse --quiet
        && echo "setup: dbt packages + manifest ready"
    volumes:
      - ../dbt:/opt/dbt
      - ./setup:/opt/setup:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: "no"

  # All of Airflow in one container (`airflow standalone`): api-server (UI + REST + execution API),
  # scheduler (LocalExecutor: runs the tasks), dag-processor and triggerer; migrates its database on start.
  # http://localhost:8080, no login.
  airflow:
    <<: *airflow-common
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      setup:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    restart: unless-stopped

  # --- Dashboards (dbt Charts) -------------------------------------------------------------

  # Live boards on http://localhost:8088/<board>/ (e.g. /fleet_overview/). Same image as Airflow:
  # dct lives in /opt/charts-venv, so no extra image on disk. Queries Trino as user "charts".
  charts:
    image: px4-lakehouse/airflow:${AIRFLOW_TAG}
    entrypoint: ["/opt/charts-venv/bin/dct"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8088", "--project-dir", "/opt/dbt"]
    user: "50000:0"
    environment:
      DBT_PROFILES_DIR: /opt/dbt
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: charts
    volumes:
      - ../dbt:/opt/dbt
      - ./scripts:/opt/scripts:ro
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8088/fleet_overview/"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    depends_on:
      trino:
        condition: service_healthy
      setup:  # dbt parse -> target/manifest.json
        condition: service_completed_successfully
    restart: unless-stopped

  # On demand only (profile "tools", never started by `make up`): `make s3 ARGS="ls s3://landing"`
  aws:
    profiles: [tools]
    image: amazon/aws-cli:${AWSCLI_TAG:?set AWSCLI_TAG in .env}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_CONFIG_FILE: /aws-config  # path-style addressing
    volumes:
      - ./setup/aws-config:/aws-config:ro

volumes:
  postgres-data:
  rustfs-data:
  airflow-logs:
  airflow-work:
