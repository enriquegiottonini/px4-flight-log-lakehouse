# Iceberg tables through the Lakekeeper REST catalog; data files on RustFS.
# Property names checked against Trino 483 (note: fs.s3.enabled, not fs.native-s3.enabled).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=px4
# The warehouse can vend STS credentials (for the browser), but Trino doesn't ask for them:
# it uses its own keys and the internal endpoint below.
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
