# Single-node Trino: the coordinator also executes queries.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory caps sized for the 2 GB heap in jvm.config (8 GB laptop budget).
# Per-node limit + default 30 % heap headroom must stay below -Xmx.
query.max-memory=1GB
query.max-memory-per-node=1GB
